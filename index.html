<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de parejas | Parejas Aleatorias</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <div class="logo-esquina">
      <img src="imagenes/chicos-en-compu.png" alt="Logo de alumnos con computadora">
    </div>

    <h1>Compañeros de computadora</h1>
    <p class="descripcion">Sistema de emparejamiento aleatorio.</p>

    <div class="listas">
      <div class="bloque">
        <h2>LISTA VARONES</h2>
        <textarea id="varones" placeholder="Ingresá un nombre por línea"></textarea>
      </div>

      <div class="bloque">
        <h2>LISTA MUJERES</h2>
        <textarea id="mujeres" placeholder="Ingresá un nombre por línea"></textarea>
      </div>
    </div>

    <div class="botones">
      <button onclick="generarParejas()">GENERAR PAREJAS</button>
      <button onclick="limpiarTodo()">LIMPIAR SISTEMA</button>
    </div>

    <div class="resultado">
      <h2>RESULTADO DEL EMPAREJAMIENTO</h2>
      <div id="resultado">Esperando ejecución...</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
